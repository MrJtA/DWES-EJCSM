<!DOCTYPE html>
<html>
<title>Contacto</title>
<body>

    <main>
    <h1>Contacto</h1>
    <p>¿Tienes alguna duda o sugerencia sobre nuestras películas? ¡Escríbenos!</p>

    <form id="form-contacto" action="#" method="POST" autocomplete="off">
        
        <div>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre">
        </div>

        <div>
            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" required placeholder="tu@correo.com">
        </div>

        <div>
            <label for="mensaje">Mensaje:</label>
            <textarea id="mensaje" name="mensaje" rows="4" required placeholder="Escribe tu mensaje aquí..."></textarea>
        </div>

        <div>
            <button type="submit">Enviar mensaje</button>
        </div>

    </form>
</main>
<script>
    window.addEventListener('pageshow', function(event) {
        if (event.persisted) {
            const formulario = document.getElementById('form-contacto');
            if (formulario) {
                formulario.reset();
            }
        }
    });
</script>
</body>
</html>
